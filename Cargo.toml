[package]
name = "spbuild"
description = "The C++ Build system for singleplayer devs"
version = "0.4.0-dev"
edition = "2024"
homepage = "https://github.com/bluelightsoftworks/spbuild"
readme = "README.md"
license = "GPL-3.0-or-later"
categories = [
    "development-tools::build-utils",
    "command-line-utilities",
    "development-tools",
]

[[bin]]
name = "sp"
path = "src/main.rs"

[dependencies]
cc = { version = "1.2.62", features = ["parallel"] }
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strum = "0.28.0"
strum_macros = "0.28.0"
target-lexicon = { version = "0.13.5", features = ["serde"] }
which = "8.0.2"
twox-hash = "2.1.2"
serde-saphyr = "1.0.0"
serde_repr = "0.1.21"
